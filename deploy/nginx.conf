map $uri $botroost_cache_control {
  default "no-cache, no-store, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
}

# WebSocket upgrade passthrough. nginx drops hop-by-hop headers unless told otherwise, and an
# empty value removes the header, so plain API calls keep their upstream keep-alive.
map $http_upgrade $botroost_connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Cache-Control $botroost_cache_control always;

  location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
  location /api/ {
    # The runtime proxy answers *documents* that the console embeds (noVNC on the remote-desktop
    # tab). add_header in a location replaces the whole inherited set, which is what we want here:
    # the server-level X-Frame-Options: DENY and CSP frame-ancestors 'none' would forbid exactly
    # that frame, and script-src 'self' would block noVNC's own inline bootstrap. Framing policy for
    # API responses belongs to the API, which sandboxes proxied documents and keeps its own
    # frame-ancestors 'none' on JSON — so restate only the headers this path still needs.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $botroost_cache_control always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # noVNC and the OneBot clients open wss:// sockets through this path. Without these two
    # lines nginx strips the upgrade handshake and the console's remote desktop never connects.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $botroost_connection_upgrade;
    # A remote desktop is a long-lived connection; nginx's default 60s read timeout would drop
    # an idle but healthy VNC session.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
  # Asset paths are content-hashed and always real files: a missing /assets/*
  # is a genuine 404, NOT a client-side route. Falling back to index.html here
  # would serve HTML where a JS module is expected and black-screen the app
  # during the stale-index/removed-asset window.
  location /assets/ {
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
